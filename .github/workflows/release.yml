name: Release workflow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build and package
        env:
          WORKFLOW_VERSION: ${{ github.ref_name }}
        run: ./scripts/build.sh

      - name: Verify packaged workflow
        env:
          WORKFLOW_VERSION: ${{ github.ref_name }}
        run: python3 scripts/verify-package.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" .build/SoulverCore.alfredworkflow "${args[@]}"
